# Publishes the site to GitHub Pages every time changes reach the main branch.
#
# 1. Runs `npm run check`. If the data has an error, nothing is published and the
#    live site stays as it was.
# 2. Copies only what the browser needs (index.html, data/, images/). Notes, scripts
#    and photo-originals/ stay in the repository but are not put on the website.
#
# One-time setup on github.com: Settings → Pages → Source: "GitHub Actions".
# To republish without a change: Actions tab → "Publish site" → "Run workflow".

name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Check the data
        run: npm run check

      - name: Gather the public files
        run: |
          mkdir _site
          cp -r index.html data images _site/
          rm -f _site/data/README.md

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5
