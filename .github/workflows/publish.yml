# Publishes the site to GitHub Pages every time changes reach the main branch.
#
# 1. Runs `npm run check`. If the data has an error, nothing is published and the
#    live site stays as it was.
# 2. Copies only what the browser needs (index.html, 404.html, sitemap.xml, sw.js,
#    data/, images/, documents/). Notes, scripts and photo-originals/ stay in the repository but
#    are not put on the website.
# 3. Adds the extras (scripts/publish-photos.py, scripts/publish-extras.mjs): 800 px
#    copies of large photos for phones, a copy of the page for each section
#    (…/stay/, …/park/) so search engines can list them, structured data, the
#    photo lists and a full sitemap. If either step fails, the plain site is
#    published as before.
#
# One-time setup on github.com: Settings → Pages → Source: "GitHub Actions".
# To republish without a change: Actions tab → "Publish site" → "Run workflow".

name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Check the data
        run: npm run check

      - name: Gather the public files
        run: |
          mkdir _site
          cp -r index.html 404.html sitemap.xml sw.js data images documents _site/
          rm -f _site/data/README.md _site/documents/README.md

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Make phone-sized photos
        continue-on-error: true
        run: |
          pip install --quiet pillow
          python scripts/publish-photos.py _site/images

      - name: Add page addresses, search data and photo lists
        continue-on-error: true
        run: node scripts/publish-extras.mjs _site

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5
